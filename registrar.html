<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Crear cuenta</title>
    
    <link rel="stylesheet" href="CSS/Base.css">
    <link rel="stylesheet" href="CSS/Auth.css">
    <link rel="stylesheet" href="CSS/Registrar.css">
    
    <script>try{if(localStorage.getItem("tema")==="claro")document.documentElement.dataset.tema="claro"}catch(e){}</script>
</head>

<body>
    <main>
        <div class="tarjeta-login">
            <h2>Crear cuenta</h2>
            
            <!-- Al registrarse, lleva al login para iniciar sesión -->
            <form id="formulario-registro">
                
                <div class="fila-campos">
                    <div class="campo">
                        <label for="nombre">Nombre(s)</label>
                        <input type="text" id="nombre" name="nombre" required autocomplete="given-name">
                    </div>
                    <div class="campo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" required autocomplete="family-name">
                    </div>
                </div>
                
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" required maxlength="60" placeholder="Ejemplo: Monterrey" autocomplete="address-level2">

                <label for="efirma">e.firma</label>
                <input type="text" id="efirma" name="efirma" required inputmode="numeric" maxlength="20"
                    pattern="[0-9]{20}" title="Número de certificado de la e.firma: 20 dígitos" placeholder="20 dígitos" autocomplete="off">
                <span class="ayuda-campo">Número de certificado de tu e.firma (20 dígitos)</span>

                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required maxlength="30" pattern="\S{3,30}"
                    title="De 3 a 30 caracteres, sin espacios" placeholder="nombre.apellido" autocomplete="username">

                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
                    title="Al menos 8 caracteres, con letras y números" placeholder="••••••••" autocomplete="new-password">
                <span class="ayuda-campo">Mínimo 8 caracteres, con letras y números</span>
                
                <label for="confirmar-clave">Confirmar contraseña</label>
                <input type="password" id="confirmar-clave" name="confirmar-clave" required placeholder="••••••••" autocomplete="new-password">
                
                <p id="registro-error" class="login-error" hidden></p>

                <button type="submit" class="boton-ingresar">Registrarse</button>
            </form>
            
            <p class="enlace-alterno">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>
    
    <script type="module" src="JS/interfaz/registrar.js"></script>
</body>
</html>
