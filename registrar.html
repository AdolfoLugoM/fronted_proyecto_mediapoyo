<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Crear cuenta</title>
    
    <link rel="stylesheet" href="CSS/Base.css">
    <link rel="stylesheet" href="CSS/Auth.css">
    <link rel="stylesheet" href="CSS/Registrar.css">
    
    <script>try{if(localStorage.getItem("tema")==="claro")document.documentElement.dataset.tema="claro"}catch(e){}</script>
</head>

<body>
    <main>
        <div class="tarjeta-login">
            <h2>Crear cuenta</h2>
            
            <!-- Al registrarse, lleva al login para iniciar sesión -->
            <form id="formulario-registro" action="login.html" novalidate>
                
                <div class="fila-campos">
                    <div class="campo">
                        <label for="nombre">Nombre(s)</label>
                        <input type="text" id="nombre" name="nombre" required autocomplete="given-name">
                    </div>
                    <div class="campo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" required autocomplete="family-name">
                    </div>
                </div>
                
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" required maxlength="100" autocomplete="address-level2">
                <span class="ayuda-campo">Las estadísticas por región se agrupan por la ciudad del médico</span>

                <label for="efirma">e.firma</label>
                <input type="text" id="efirma" name="efirma" required autocomplete="off">
                <span class="ayuda-campo">Tu firma electrónica (por ejemplo, el número de tu e.firma o tu cédula profesional)</span>

                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required minlength="3" maxlength="50" pattern="[A-Za-z0-9._\-]+"
                    title="Letras, números, punto, guion y guion bajo (mínimo 3 caracteres)" placeholder="nombre.apellido" autocomplete="username">

                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" required minlength="8" placeholder="••••••••" autocomplete="new-password">
                <span class="ayuda-campo">Mínimo 8 caracteres</span>
                
                <label for="confirmar-clave">Confirmar contraseña</label>
                <input type="password" id="confirmar-clave" name="confirmar-clave" required placeholder="••••••••" autocomplete="new-password">
                
                <p id="registro-error" class="login-error" hidden></p>

                <button type="submit" class="boton-ingresar">Registrarse</button>
            </form>
            
            <p class="enlace-alterno">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>
    
    <script type="module" src="JS/interfaz/registrar.js"></script>
</body>
</html>
