<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Iniciar Sesión</title>
    
    <link rel="stylesheet" href="CSS/Base.css">
    <link rel="stylesheet" href="CSS/Auth.css">
    <link rel="stylesheet" href="CSS/Login.css">
</head>

<body>
    <main>
        <div class="logo">
            <img src="IMAGES/hospital-medical-signal-of-a-cross-in-a-circle-svgrepo-com.svg" alt="Logo de la empresa">
            <span class="nombre-empresa">MediApoyo</span>
        </div>
        
        <div class="tarjeta-login">
            <h2>Iniciar Sesión</h2>
            
            <form id="formulario-login" action="index.html">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required placeholder="correo@gmail.com">
                
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" required placeholder="••••••••">
                
                <p id="login-error" class="login-error" hidden></p>
                
                <button type="submit" class="boton-ingresar">Ingresar</button>
            </form>
            
            <script type="module" src="JS/interfaz/login.js"></script>
            <p class="enlace-alterno">¿No tienes cuenta? <a href="registrar.html">Regístrate</a></p>
        </div>
    </main>
</body>
</html>
